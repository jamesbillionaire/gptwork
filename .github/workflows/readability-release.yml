name: Verify minimum-readable quotation typography
on:
  push:
    branches: [automation/quotation-readability-20260922]
    paths: ['.release/**', '.github/workflows/readability-release.yml']
permissions:
  contents: write
jobs:
  verify:
    if: startsWith(github.event.head_commit.message, 'Stage quotation readability')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y fonts-liberation fonts-dejavu-core poppler-utils
      - run: python -m pip install -r requirements.txt
      - name: Check baseline and install verified revision
        run: |
          python -m quotation_engine.cli verify-lock
          python .release/install.py
      - name: Verify lock and readability regressions
        run: |
          python -m quotation_engine.cli verify-lock
          python -m unittest discover -s quotation_engine/tests -v
          python -m quotation_engine.cli render-examples --output output/readability
      - name: Render all fixture pages
        run: |
          mkdir -p output/previews
          for file in output/readability/*.pdf; do
            stem=$(basename "$file" .pdf)
            pdftoppm -png -r 100 "$file" "output/previews/$stem"
          done
      - name: Commit verified clean source to staging only
        run: |
          rm -rf .release
          rm .github/workflows/readability-release.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Enforce 10pt minimum and 11pt body in both quotation templates'
          git push origin HEAD:automation/quotation-readability-20260922
      - uses: actions/upload-artifact@v4
        with:
          name: quotation-readability-verification
          path: output/
          retention-days: 30
