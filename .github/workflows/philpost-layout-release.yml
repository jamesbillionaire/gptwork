name: Verify Philpost flow and padded sign-off
on:
  push:
    branches: [automation/philpost-flow-signoff-20260922]
permissions:
  contents: write
jobs:
  verify:
    if: startsWith(github.event.head_commit.message, 'Stage Philpost flow')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y fonts-liberation fonts-dejavu-core poppler-utils
      - run: python -m pip install -r requirements.txt
      - name: Render unchanged baseline
        run: |
          python -m quotation_engine.cli verify-lock
          python -m quotation_engine.cli render-examples --output output/before
      - name: Install checked source delta
        run: python .release/install.py
      - name: Verify lock and 18 regressions
        run: |
          python -m quotation_engine.cli verify-lock
          python -m unittest discover -s quotation_engine/tests -v
          python -m quotation_engine.cli render-examples --output output/after
          python -c "from pathlib import Path; files=list(Path('output/before').glob('*.pdf')); assert len(files)==4; assert all(p.read_bytes()==(Path('output/after')/p.name).read_bytes() for p in files)"
      - name: Commit verified source on staging only
        run: |
          rm -rf .release
          rm .github/workflows/philpost-layout-release.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add tested continuous quotation flow and padded LAVI sign-off'
          git push origin HEAD:automation/philpost-flow-signoff-20260922
