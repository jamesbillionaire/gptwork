name: LAVI quotation engine

on:
  pull_request:
    paths:
      - "quotation_engine/**"
      - ".agents/skills/lavi-quotation/**"
      - "AGENTS.md"
      - "requirements.txt"
      - ".github/workflows/lavi-quotation-engine.yml"
  push:
    branches: [main]
    paths:
      - "quotation_engine/**"
      - ".agents/skills/lavi-quotation/**"
      - "AGENTS.md"
      - "requirements.txt"
      - ".github/workflows/lavi-quotation-engine.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s quotation_engine/tests -v
