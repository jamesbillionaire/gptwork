name: Approved quotation engines
on:
  push:
    branches: [main]
    paths:
      - 'quotation_engine/**'
      - 'templates/**'
      - 'requirements.txt'
      - '.github/workflows/lavi-quotation-engine.yml'
  pull_request:
    paths:
      - 'quotation_engine/**'
      - 'templates/**'
      - 'requirements.txt'
      - '.github/workflows/lavi-quotation-engine.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y fonts-liberation fonts-dejavu-core poppler-utils
      - run: python -m pip install -r requirements.txt
      - run: python -m quotation_engine.cli verify-lock
      - run: python -m unittest discover -s quotation_engine/tests -v
      - run: python -m quotation_engine.cli render-examples --output output/golden
      - name: Render every fixture page
        run: |
          mkdir -p output/previews
          for file in output/golden/*.pdf; do
            stem=$(basename "$file" .pdf)
            pdftoppm -png -r 120 "$file" "output/previews/$stem"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: approved-quotation-regressions
          path: output/
          retention-days: 30
