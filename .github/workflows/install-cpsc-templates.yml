name: Install reviewed CPSC template release
on:
  push:
    branches: [automation/cpsc-template-release-20260921]
    paths: ['.release/**', '.github/workflows/install-cpsc-templates.yml']
permissions:
  contents: write
jobs:
  install:
    if: startsWith(github.event.head_commit.message, 'Stage approved CPSC template installer')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify and install release
        run: python .release/install.py
      - run: sudo apt-get update && sudo apt-get install -y fonts-liberation fonts-dejavu-core poppler-utils
      - run: python -m pip install -r requirements.txt
      - run: python -m quotation_engine.cli verify-lock
      - run: python -m unittest discover -s quotation_engine/tests -v
      - run: python -m quotation_engine.cli render-examples --output output/golden
      - name: Render all fixture pages
        run: |
          mkdir -p output/previews
          for file in output/golden/*.pdf; do
            stem=$(basename "$file" .pdf)
            pdftoppm -png -r 120 "$file" "output/previews/$stem"
          done
      - name: Commit verified release on staging branch
        run: |
          rm -rf .release
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Install approved CPSC quotation engine 2.0.0 after regression checks'
          git push origin HEAD:automation/cpsc-template-release-20260921
      - uses: actions/upload-artifact@v4
        with:
          name: cpsc-release-verification
          path: output/
          retention-days: 30
